<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Top arc path for text -->
    <path id="top-arc" d="M 28 100 A 72 72 0 1 1 172 100" fill="none" />
    <!-- Bottom arc path for text (counter-clockwise so text reads upright from left to right) -->
    <path id="bottom-arc" d="M 172 100 A 72 72 0 0 1 28 100" fill="none" />
  </defs>

  <g transform="rotate(-12 100 100)">
    <!-- Outer thick ring -->
    <circle cx="100" cy="100" r="92" fill="none" stroke="#0d3eb8" stroke-width="3.5" />
    
    <!-- Outer thin ring -->
    <circle cx="100" cy="100" r="87" fill="none" stroke="#0d3eb8" stroke-width="1.2" />

    <!-- Inner circle border -->
    <circle cx="100" cy="100" r="56" fill="none" stroke="#0d3eb8" stroke-width="1.8" />
    <circle cx="100" cy="100" r="53" fill="none" stroke="#0d3eb8" stroke-width="0.8" />

    <!-- Circular Text: Top -->
    <text fill="#0d3eb8" font-family="'Arial Black', Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5">
      <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
        ★ DEERO ADVERTISING AGENCY ★
      </textPath>
    </text>

    <!-- Circular Text: Bottom -->
    <text fill="#0d3eb8" font-family="'Arial Black', Arial, sans-serif" font-size="10.5" font-weight="900" letter-spacing="2">
      <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
        MOGADISHU - SOMALIA
      </textPath>
    </text>

    <!-- Center Content -->
    <!-- Center Deero stylized text -->
    <g transform="translate(100, 96)">
      <!-- Antler / flourish accent -->
      <path d="M 18 -16 C 24 -24 35 -20 32 -13 C 30 -8 22 -10 19 -14 Z" fill="#0d3eb8" />
      <path d="M 23 -13 C 28 -17 33 -15 31 -11 Z" fill="#0d3eb8" />
      
      <!-- 'deero' text -->
      <text x="0" y="2" text-anchor="middle" fill="#0d3eb8" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="34" font-weight="bold" font-style="italic">
        deero
      </text>
      
      <!-- 'Advertising Agency' subtitle in center -->
      <text x="0" y="16" text-anchor="middle" fill="#0d3eb8" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" letter-spacing="1">
        ADVERTISING AGENCY
      </text>

      <!-- Small stars/dots under center -->
      <text x="0" y="26" text-anchor="middle" fill="#0d3eb8" font-size="7">
        ★  ★  ★
      </text>
    </g>
  </g>
</svg>
